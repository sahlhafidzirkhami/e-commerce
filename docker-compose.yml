# Hanya untuk development lokal. Kredensial di bawah bukan untuk production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sportswear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportswear
      POSTGRES_PASSWORD: sportswear
      POSTGRES_DB: sportswear
      TZ: Asia/Jakarta
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sportswear -d sportswear']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sportswear-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
